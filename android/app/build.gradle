plugins { id 'com.android.application' }
android {
    namespace 'com.coinflip.widget'
    compileSdk 35
    defaultConfig {
        applicationId 'com.coinflip.widget'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        // Fixed key committed to the repo so new versions install over old ones.
        shared { storeFile file('coinflip.keystore'); storePassword 'coinflip'; keyAlias 'coinflip'; keyPassword 'coinflip' }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.shared } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
