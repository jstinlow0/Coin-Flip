name: Build Android widget

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CoinFlip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CoinFlip-apk
          path: CoinFlip.apk
      - name: Publish to "Latest widget" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete widget-latest --yes --cleanup-tag || true
          gh release create widget-latest CoinFlip.apk \
            --title "Coin Flip widget (latest)" \
            --notes "Open this page on your Android phone and tap CoinFlip.apk to download and install." \
            --target "${{ github.sha }}"
