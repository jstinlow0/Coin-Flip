<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coin Flip">
<title>Coin Flip</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root { --bg:#14161c; --fg:#f2efe6; --muted:#8a8f9c; --gold:#e0b54a; --gold-dark:#a87d1e; --ink:#6e500e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; user-select:none; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); touch-action:manipulation; }
  .stage { perspective:1000px; }
  .coin { width:min(64vw,260px); aspect-ratio:1; position:relative; transform-style:preserve-3d; cursor:pointer; }
  .face { position:absolute; inset:0; border-radius:50%; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, #f6d77c, var(--gold) 55%, var(--gold-dark));
    box-shadow:inset 0 0 0 10px var(--gold-dark), inset 0 0 0 14px #f6d77c, 0 18px 40px rgba(0,0,0,.5);
    color:var(--ink); font-family:Georgia,serif; font-weight:bold; }
  .face .big { font-size:clamp(64px,22vw,110px); line-height:1; }
  .face .small { font-size:clamp(14px,4vw,18px); letter-spacing:.2em; margin-top:6px; }
  .tails { transform:rotateY(180deg); }
  .result { font-size:28px; font-weight:700; letter-spacing:.08em; min-height:1.2em; }
  .hint { color:var(--muted); font-size:15px; }
  .tally { color:var(--muted); font-size:14px; }
  button { background:var(--gold); color:#2a1f05; border:0; border-radius:999px; padding:16px 44px;
    font-size:18px; font-weight:700; letter-spacing:.05em; }
  button:active { transform:scale(.97); }
</style>
</head>
<body>
  <div class="stage"><div class="coin" id="coin" aria-label="Coin">
    <div class="face heads"><span class="big">H</span><span class="small">HEADS</span></div>
    <div class="face tails"><span class="big">T</span><span class="small">TAILS</span></div>
  </div></div>
  <div class="result" id="result" aria-live="polite"></div>
  <button id="flip">FLIP</button>
  <div class="tally" id="tally">Heads 0 · Tails 0</div>
<script>
  const coin = document.getElementById('coin'), result = document.getElementById('result'),
        btn = document.getElementById('flip'), tally = document.getElementById('tally');
  let rot = 0, busy = false, h = 0, t = 0;
  function flip() {
    if (busy) return; busy = true; result.textContent = '';
    const heads = crypto.getRandomValues(new Uint8Array(1))[0] < 128;
    const target = heads ? 0 : 180;
    rot += 1800 + ((target - rot % 360) + 360) % 360;   // 5 full spins, land on the right face
    if (navigator.vibrate) navigator.vibrate(30);
    coin.animate([{ transform: coin.style.transform || 'rotateY(0deg)' },
                  { transform: `translateY(-120px) rotateY(${rot - 900}deg)`, offset: .5 },
                  { transform: `rotateY(${rot}deg)` }],
                 { duration: 1400, easing: 'cubic-bezier(.3,.7,.4,1)' }).onfinish = () => {
      coin.style.transform = `rotateY(${rot}deg)`;
      heads ? h++ : t++;
      result.textContent = heads ? 'HEADS' : 'TAILS';
      tally.textContent = `Heads ${h} · Tails ${t}`;
      busy = false;
    };
  }
  btn.addEventListener('click', flip); coin.addEventListener('click', flip);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
